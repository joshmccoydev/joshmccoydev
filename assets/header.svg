<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 168" role="img">
  <title>Coastal Bend, Texas. Bots, automations and tools that do real work.</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#2a2a2e" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#18181b" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#18181b" stop-opacity="0.94"/>
    </linearGradient>
  </defs>
  <rect width="960" height="168" rx="16" fill="#18181b"/>
  <rect width="960" height="168" rx="16" fill="url(#grid)"/>
  <rect width="960" height="168" rx="16" fill="url(#fade)"/>
  <rect x="1" y="1" width="958" height="166" rx="15" fill="none" stroke="#52525b" stroke-width="2"/>
  <circle cx="40" cy="48" r="5" fill="#c6ff3d"/>
  <text x="58" y="53" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" letter-spacing="1.6">COASTAL BEND, TEXAS</text>
  <text x="36" y="114" fill="#ededef" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600">Bots, automations and tools that do real work.</text>
</svg>
